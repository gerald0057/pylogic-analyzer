[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "pylogic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.scripts]
pylogic = "pylogic.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pylogic._native"
